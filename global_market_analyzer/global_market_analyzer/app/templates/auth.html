{% extends 'base.html' %}{% block content %}<div class="auth-card panel p-4 mx-auto"><h2 class="mb-1">{{ mode }} account</h2><p class="text-secondary">Access your export intelligence workspace.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if mode=='Register' %}<label class="form-label">Full name</label><input class="form-control mb-3" name="name" maxlength="100" required>{% endif %}<label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" required><label class="form-label">Password</label><input class="form-control mb-3" name="password" type="password" minlength="8" required><button class="btn btn-gold w-100">{{ mode }}</button></form><p class="small text-secondary mt-3">{% if mode=='Register' %}Already registered? <a href="/login">Login</a>{% else %}New here? <a href="/register">Create an account</a>{% endif %}</p></div>{% endblock %}
